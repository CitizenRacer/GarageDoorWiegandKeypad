# Garage Keypad firmware versioning
# VERSIONING RULE: Increment firmware_version by 1 for every repository check-in
# of this file.
#
# This file is designed to be consumed as a remote ESPHome Git package. Remote
# packages cannot perform !secret lookups, so the local Device Builder wrapper
# supplies credential substitutions from its local secrets.yaml file.
substitutions:
  firmware_version: "20"

  # Default ESP32 GPIOs for the low-voltage side of the Wiegand level shifter.
  # Physical wiring:
  #   Keypad Green D0 -> HV3/LV3 -> GPIO22
  #   Keypad White D1 -> HV2/LV2 -> GPIO19
  garage_keypad_d0_pin: "GPIO22"
  garage_keypad_d1_pin: "GPIO19"

  # Home Assistant cover controlled by the keypad. A standalone '*' or '#'
  # may CLOSE this cover only when Home Assistant reports it exactly open.
  garage_door_entity_id: "cover.ratgdov25i_15cde7_door"

  # Lock Code Manager is the canonical PIN database. Use the stable config-entry
  # ID rather than the display title so renaming the LCM entry cannot break the
  # keypad. Override this in the local Device Builder wrapper if the entry is
  # ever recreated.
  lock_code_manager_entry_id: "01M1B0469B76V0TSN5FBPDYHJC"

  # Attribution-only entity ID reported to Lock Code Manager as the credential
  # source. This entity is not used to carry the PIN; the PIN is sent only as
  # action data over ESPHome's encrypted native API.
  garage_keypad_source_entity_id: "binary_sensor.garage_garage_keypad_debug_mode"

  # SECURITY/SAFETY: Leave false in production. Home Assistant's guarded garage
  # script refuses to operate the garage whenever this reports true. This is
  # deliberately independent of credential logging; PINs are never logged.
  keypad_debug_mode: "false"

esphome:
  name: garage-keypad
  friendly_name: Garage Keypad

  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("startup", "Firmware version: %s", ESPHOME_PROJECT_VERSION);
            ESP_LOGI("startup", "ready");

  project:
    name: "citizenracer.garage_keypad"
    version: "${firmware_version}"

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

# Home Assistant communicates with the device over ESPHome's encrypted native
# API. The Noise PSK is supplied by the local Device Builder wrapper.
api:
  encryption:
    key: "${garage_keypad_api_encryption_key}"

  on_client_connected:
    - if:
        condition:
          lambda: |-
            return client_info.find("Home Assistant ") == 0;
        then:
          - lambda: |-
              if (id(home_assistant_api_connections) < 255) {
                id(home_assistant_api_connections) += 1;
              }
    - delay: 3s
    - lambda: |-
        ESP_LOGI("startup", "Firmware version: %s", ESPHOME_PROJECT_VERSION);
        ESP_LOGI("startup", "ready");
        ESP_LOGI("api_client", "Connected: client_info='%s' address='%s'",
                 client_info.c_str(), client_address.c_str());

  on_client_disconnected:
    - if:
        condition:
          lambda: |-
            return client_info.find("Home Assistant ") == 0;
        then:
          - lambda: |-
              if (id(home_assistant_api_connections) > 0) {
                id(home_assistant_api_connections) -= 1;
              }
    - delay: 3s
    - lambda: |-
        ESP_LOGI("api_client", "Disconnected: client_info='%s' address='%s'",
                 client_info.c_str(), client_address.c_str());

ota:
  - platform: esphome
    password: "${ota_password}"

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"

  ap:
    ssid: "Garage-Keypad-Fallback"
    password: "${fallback_ap_password}"

captive_portal:

# Enter a minimal recovery environment after repeated failed boots.
safe_mode:
  num_attempts: 5
  boot_is_good_after: 1min
  reboot_timeout: 10min

# ---------------------------------------------------------------------------
# Garage keypad - Wiegand input and PIN/RFID processing
# ---------------------------------------------------------------------------
wiegand:
  - id: garage_keypad_wiegand
    d0: "${garage_keypad_d0_pin}"
    d1: "${garage_keypad_d1_pin}"

    # Wiegand keypad keys 10 and 11 are '*' and '#'. A truly standalone '*' or
    # '#' is a CLOSE-ONLY shortcut. It can never issue an open command.
    on_key:
      - if:
          condition:
            lambda: |-
              return x <= 9;
          then:
            - lambda: |-
                id(keypad_pin_entry_active) = true;
          else:
            - if:
                condition:
                  lambda: |-
                    return x == 10 || x == 11;
                then:
                  - if:
                      condition:
                        lambda: |-
                          return !id(keypad_pin_entry_active) &&
                                 id(garage_door_state).has_state() &&
                                 id(garage_door_state).state == "open";
                      then:
                        - logger.log:
                            tag: keypad
                            level: INFO
                            format: "Standalone close key pressed while garage is open; requesting close"
                        - homeassistant.action:
                            action: cover.close_cover
                            data:
                              entity_id: "${garage_door_entity_id}"
                  - lambda: |-
                      id(keypad_pin_entry_active) = false;

    # ESPHome decodes/parity-checks 26-, 34-, and 37-bit Wiegand RFID frames.
    # RFID authorization is intentionally disabled in v20. Lock Code Manager's
    # external-credential path currently manages PINs; do not disguise RFID IDs
    # as PINs. Keep diagnostics so RFID can be migrated cleanly when LCM supports
    # the credential type end to end.
    on_tag:
      - lambda: |-
          ESP_LOGI("rfid", "RFID tag received: %s (authorization disabled)", x.c_str());

    # on_raw also sees keypad key frames. Never log 4- or 8-bit frames because
    # they encode individual keypad keystrokes and could disclose PIN digits.
    on_raw:
      - lambda: |-
          if (bits > 8) {
            ESP_LOGI("rfid",
                     "Wiegand RFID/raw frame: %u bits, value=0x%llX",
                     static_cast<unsigned>(bits),
                     static_cast<unsigned long long>(value));
          }

# Collect 4-8 numeric digits. '#' submits the PIN, '*' clears the current
# entry, and an incomplete entry is discarded after ten seconds.
#
# Lock Code Manager is the sole PIN database. The plaintext PIN exists only in
# the transient ESPHome key collector and in the encrypted native-API action
# request to lock_code_manager.use_credential. It is never published as an
# entity state or intentionally written to a log.
key_collector:
  - id: garage_keypad_pin
    source_id: garage_keypad_wiegand
    min_length: 4
    max_length: 8
    allowed_keys: "0123456789"
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    timeout: 10s

    on_result:
      - lambda: |-
          id(keypad_pin_entry_active) = false;
          ESP_LOGI("keypad", "PIN entered (%u digits); validating with Lock Code Manager",
                   static_cast<unsigned>(x.size()));

      - homeassistant.action:
          action: lock_code_manager.use_credential
          data:
            config_entry_id: "${lock_code_manager_entry_id}"
            code: !lambda |-
              return x;
            source: "${garage_keypad_source_entity_id}"
            target: "${garage_door_entity_id}"
          capture_response: true
          on_success:
            - if:
                condition:
                  lambda: |-
                    JsonVariantConst wrapped = response["response"];
                    if (!wrapped.is<JsonObjectConst>()) {
                      ESP_LOGE("keypad", "Lock Code Manager returned an unexpected response shape");
                      return false;
                    }
                    JsonObjectConst check = wrapped.as<JsonObjectConst>();
                    return check["valid"] | false;
                then:
                  - lambda: |-
                      JsonObjectConst check = response["response"].as<JsonObjectConst>();
                      const char *user = check["user"] | "";
                      ESP_LOGI("keypad", "Credential accepted by Lock Code Manager for user '%s'", user);
                  - homeassistant.action:
                      action: script.garage_keypad_open_garage
                      data:
                        person_name: !lambda |-
                          JsonObjectConst check = response["response"].as<JsonObjectConst>();
                          const char *user = check["user"] | "";
                          return std::string(user);
                else:
                  - lambda: |-
                      JsonVariantConst wrapped = response["response"];
                      if (!wrapped.is<JsonObjectConst>()) {
                        return;
                      }
                      JsonObjectConst check = wrapped.as<JsonObjectConst>();
                      const char *reason = check["reason"] | "unknown";
                      ESP_LOGW("keypad", "Credential rejected by Lock Code Manager: %s", reason);
          on_error:
            - logger.log:
                tag: keypad
                level: ERROR
                format: "Lock Code Manager credential validation action failed; refusing garage operation"

    on_timeout:
      - lambda: |-
          id(keypad_pin_entry_active) = false;
          ESP_LOGI("keypad", "PIN entry timed out");

# Onboard blue LED on this 30-pin ESP32-WROOM-32 board is GPIO2.
output:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: blue_led_output

light:
  - platform: binary
    id: blue_status_led
    output: blue_led_output
    internal: true
    restore_mode: ALWAYS_OFF

globals:
  - id: keypad_pin_entry_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: blue_status_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: home_assistant_api_connections
    type: uint8_t
    restore_value: no
    initial_value: '0'

# Status LED behavior:
#   Regular blink:        Wi-Fi is disconnected / searching.
#   Double blink + pause: Wi-Fi is connected, but Home Assistant is not.
#   Solid:                Home Assistant is connected to the encrypted API.
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(home_assistant_api_connections) > 0;
          then:
            - light.turn_on: blue_status_led
            - lambda: |-
                id(blue_status_phase) = 0;
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        lambda: |-
                          return id(blue_status_phase) == 0 ||
                                 id(blue_status_phase) == 2;
                      then:
                        - light.turn_on: blue_status_led
                      else:
                        - light.turn_off: blue_status_led
                  - lambda: |-
                      id(blue_status_phase) =
                          (id(blue_status_phase) + 1) % 7;
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(blue_status_phase) < 2;
                      then:
                        - light.turn_on: blue_status_led
                      else:
                        - light.turn_off: blue_status_led
                  - lambda: |-
                      id(blue_status_phase) =
                          (id(blue_status_phase) + 1) % 4;

# Expose Home Assistant connection state and a dedicated debug-mode safety gate.
binary_sensor:
  - platform: template
    name: "Home Assistant Connected"
    id: home_assistant_connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(home_assistant_api_connections) > 0;

  - platform: template
    name: "Debug Mode"
    id: garage_keypad_debug_mode
    icon: "mdi:bug"
    entity_category: diagnostic
    lambda: |-
      return strcmp("${keypad_debug_mode}", "true") == 0;

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    type: seconds

  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  # Fail closed for the standalone close shortcut: only exact state "open"
  # permits the close request.
  - platform: homeassistant
    id: garage_door_state
    entity_id: "${garage_door_entity_id}"
    internal: true

  - platform: template
    name: "Firmware Version"
    id: firmware_version_text
    icon: "mdi:information-box"
    entity_category: diagnostic
    update_interval: 600s
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "WiFi MAC Address"

button:
  - platform: restart
    name: "Restart"

  - platform: safe_mode
    name: "Restart in Safe Mode"
