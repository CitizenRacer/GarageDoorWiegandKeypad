esphome:
  name: garage-keypad
  friendly_name: Garage Keypad

  on_boot:
    then:
      - light.turn_on:
          id: onboard_led
          brightness: 20%
          red: 0%
          green: 100%
          blue: 0%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Garage-Keypad-Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Status LED"
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    type: seconds

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "WiFi MAC Address"

button:
  - platform: restart
    name: "Restart"
