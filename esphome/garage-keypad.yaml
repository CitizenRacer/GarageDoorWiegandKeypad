# Garage Keypad firmware versioning
# VERSIONING RULE: Increment firmware_version by 1 for every repository check-in
# of this file.
#
# This file is designed to be consumed as a remote ESPHome Git package. Remote
# packages cannot perform !secret lookups, so the local Device Builder wrapper
# supplies the credential substitutions from its local secrets.yaml file.
substitutions:
  firmware_version: "13"

  # Default ESP32 GPIOs for the low-voltage side of the Wiegand level shifter.
  # Physical wiring:
  #   Keypad Green D0 -> HV3/LV3 -> GPIO22
  #   Keypad White D1 -> HV2/LV2 -> GPIO19
  # These can be overridden from the local Device Builder wrapper without
  # modifying this remote package.
  garage_keypad_d0_pin: "GPIO22"
  garage_keypad_d1_pin: "GPIO19"

  # SECURITY: Leave false in production. Set to true only while actively
  # testing the keypad; when enabled, completed PINs are written to ESPHome's
  # logs in plaintext and published to the Debug Last Keypad Value entity in
  # Home Assistant.
  keypad_debug_logging: "false"

esphome:
  name: garage-keypad
  friendly_name: Garage Keypad

  # Log an explicit firmware version and readiness marker after ESPHome's
  # components have completed initialization. These are also repeated after an
  # API client connects so remote log viewers reliably see them.
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("startup", "Firmware version: %s", ESPHOME_PROJECT_VERSION);
            ESP_LOGI("startup", "ready");

  # ESP-IDF eFuse/RNG APIs used for one-time BLK3 HMAC-key provisioning, plus
  # Mbed TLS for software HMAC-SHA256 using the readable BLK3 key.
  # Angle-bracket includes are emitted directly into ESPHome's generated
  # main.cpp, so they also work when this YAML is consumed as a remote package.
  includes:
    - <esp_efuse.h>
    - <esp_random.h>
    - <esp_err.h>
    - <mbedtls/md.h>

  project:
    name: "citizenracer.garage_keypad"
    version: "${firmware_version}"

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

# Home Assistant communicates with the device over ESPHome's encrypted
# native API. The Noise PSK is supplied by the local Device Builder wrapper.
#
# Track Home Assistant connections by the API client's reported name rather
# than by generic API connection state. API client identity is also logged on
# connect/disconnect to make connection-state debugging unambiguous.
api:
  encryption:
    key: "${garage_keypad_api_encryption_key}"

  # Generate a verifier for a PIN without exposing the device HMAC key.
  # The input is deliberately a string so PINs with leading zeroes are
  # represented exactly the same way as keypad input. The action returns the
  # HMAC-SHA256 as 64 lowercase hexadecimal characters and also publishes it
  # to the Generated PIN HMAC diagnostic text sensor for easy copying.
  actions:
    - action: generate_pin_hmac
      variables:
        pin: string
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              constexpr size_t KEY_BYTES = 32;
              constexpr size_t KEY_BITS = KEY_BYTES * 8;
              constexpr size_t DIGEST_BYTES = 32;
              static constexpr char HEX[] = "0123456789abcdef";

              root["algorithm"] = "HMAC-SHA256";

              if (pin.size() < 4 || pin.size() > 8) {
                root["success"] = false;
                root["error"] = "PIN must contain 4-8 digits";
                return;
              }

              for (const char c : pin) {
                if (c < '0' || c > '9') {
                  root["success"] = false;
                  root["error"] = "PIN must contain digits only";
                  return;
                }
              }

              if (esp_efuse_get_coding_scheme(EFUSE_BLK3) !=
                  EFUSE_CODING_SCHEME_NONE) {
                root["success"] = false;
                root["error"] = "BLK3 is not configured as a 256-bit uncoded block";
                return;
              }

              if (esp_efuse_get_key_dis_read(EFUSE_BLK3)) {
                root["success"] = false;
                root["error"] = "BLK3 is read-protected";
                return;
              }

              if (!esp_efuse_get_key_dis_write(EFUSE_BLK3)) {
                root["success"] = false;
                root["error"] = "BLK3 HMAC key is not write-protected";
                return;
              }

              uint8_t key[KEY_BYTES] = {};
              const auto wipe = [](uint8_t *buffer, size_t length) {
                volatile uint8_t *p = buffer;
                while (length-- > 0) {
                  *p++ = 0;
                }
              };

              esp_err_t err = esp_efuse_read_block(
                  EFUSE_BLK3, key, 0, KEY_BITS);
              if (err != ESP_OK) {
                wipe(key, sizeof(key));
                root["success"] = false;
                root["error"] = "Unable to read BLK3 HMAC key";
                return;
              }

              uint8_t key_or = 0;
              for (size_t i = 0; i < KEY_BYTES; i++) {
                key_or |= key[i];
              }
              if (key_or == 0) {
                wipe(key, sizeof(key));
                root["success"] = false;
                root["error"] = "BLK3 HMAC key is empty";
                return;
              }

              const mbedtls_md_info_t *md_info =
                  mbedtls_md_info_from_type(MBEDTLS_MD_SHA256);
              if (md_info == nullptr) {
                wipe(key, sizeof(key));
                root["success"] = false;
                root["error"] = "SHA-256 is unavailable";
                return;
              }

              uint8_t digest[DIGEST_BYTES] = {};
              const int hmac_result = mbedtls_md_hmac(
                  md_info,
                  key,
                  sizeof(key),
                  pin.byte(),
                  pin.size(),
                  digest);
              wipe(key, sizeof(key));

              if (hmac_result != 0) {
                wipe(digest, sizeof(digest));
                root["success"] = false;
                root["error"] = "HMAC-SHA256 calculation failed";
                return;
              }

              char hex[DIGEST_BYTES * 2 + 1] = {};
              for (size_t i = 0; i < DIGEST_BYTES; i++) {
                hex[i * 2] = HEX[(digest[i] >> 4) & 0x0F];
                hex[i * 2 + 1] = HEX[digest[i] & 0x0F];
              }
              hex[DIGEST_BYTES * 2] = '\0';
              wipe(digest, sizeof(digest));

              id(generated_pin_hmac).publish_state(hex);
              root["success"] = true;
              root["hmac"] = hex;

  on_client_connected:
    # Update the LED state immediately.
    - if:
        condition:
          lambda: |-
            return client_info.find("Home Assistant ") == 0;
        then:
          - lambda: |-
              if (id(home_assistant_api_connections) < 255) {
                id(home_assistant_api_connections) += 1;
              }
    # A newly connected log viewer is not yet subscribed at the instant this
    # callback fires. Delay diagnostic messages so the remote log stream has
    # time to become active and can receive them.
    - delay: 3s
    - lambda: |-
        ESP_LOGI("startup", "Firmware version: %s", ESPHOME_PROJECT_VERSION);
        ESP_LOGI("startup", "ready");
        ESP_LOGI("api_client", "Connected: client_info='%s' address='%s'",
                 client_info.c_str(), client_address.c_str());

        constexpr size_t KEY_BYTES = 32;
        constexpr size_t KEY_BITS = KEY_BYTES * 8;
        const esp_efuse_coding_scheme_t scheme =
            esp_efuse_get_coding_scheme(EFUSE_BLK3);
        const bool read_protected = esp_efuse_get_key_dis_read(EFUSE_BLK3);
        const bool write_protected = esp_efuse_get_key_dis_write(EFUSE_BLK3);

        if (scheme != EFUSE_CODING_SCHEME_NONE) {
          ESP_LOGW("hmac_status",
                   "BLK3 status: coding scheme=%d; expected 256-bit NONE",
                   static_cast<int>(scheme));
        } else if (read_protected) {
          ESP_LOGW("hmac_status",
                   "BLK3 status: read-protected; HMAC key material cannot be inspected by firmware");
        } else {
          uint8_t block[KEY_BYTES] = {};
          const esp_err_t err =
              esp_efuse_read_block(EFUSE_BLK3, block, 0, KEY_BITS);
          if (err != ESP_OK) {
            ESP_LOGE("hmac_status", "BLK3 status read failed: %s",
                     esp_err_to_name(err));
          } else {
            uint8_t block_or = 0;
            for (size_t i = 0; i < KEY_BYTES; i++) {
              block_or |= block[i];
            }

            volatile uint8_t *wipe = block;
            for (size_t i = 0; i < KEY_BYTES; i++) {
              wipe[i] = 0;
            }

            if (block_or != 0 && write_protected) {
              ESP_LOGI("hmac_status",
                       "HMAC key already provisioned; BLK3 is write-protected and readable");
            } else if (block_or != 0) {
              ESP_LOGW("hmac_status",
                       "BLK3 status: non-empty but NOT write-protected");
            } else if (write_protected) {
              ESP_LOGE("hmac_status",
                       "BLK3 status: empty and write-protected; key cannot be provisioned");
            } else {
              ESP_LOGW("hmac_status",
                       "BLK3 status: empty and writable; HMAC key has not been provisioned");
            }
          }
        }
  on_client_disconnected:
    # Update the LED state immediately.
    - if:
        condition:
          lambda: |-
            return client_info.find("Home Assistant ") == 0;
        then:
          - lambda: |-
              if (id(home_assistant_api_connections) > 0) {
                id(home_assistant_api_connections) -= 1;
              }
    - delay: 3s
    - lambda: |-
        ESP_LOGI("api_client", "Disconnected: client_info='%s' address='%s'",
                 client_info.c_str(), client_address.c_str());

ota:
  - platform: esphome
    password: "${ota_password}"

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"

  # Provision the device-unique HMAC key only after Wi-Fi has connected. On
  # classic ESP32, the active Wi-Fi RF subsystem supplies true entropy to the
  # hardware RNG used by esp_fill_random().
  #
  # Safety rules:
  #   * make at most one provisioning attempt per boot;
  #   * require the normal 256-bit/uncoded eFuse coding scheme;
  #   * refuse to proceed if BLK3 is read- or write-protected;
  #   * refuse to touch BLK3 if any bit is already programmed;
  #   * never log the generated key;
  #   * verify the burn before permanently write-protecting BLK3;
  #   * deliberately leave BLK3 readable so firmware can use the HMAC key.
  on_connect:
    - lambda: |-
        static bool provisioning_attempted = false;
        constexpr const char *TAG = "hmac_provision";
        constexpr size_t KEY_BYTES = 32;
        constexpr size_t KEY_BITS = KEY_BYTES * 8;

        if (provisioning_attempted) {
          return;
        }
        provisioning_attempted = true;

        const auto wipe = [](uint8_t *buffer, size_t length) {
          volatile uint8_t *p = buffer;
          while (length-- > 0) {
            *p++ = 0;
          }
        };

        const esp_efuse_coding_scheme_t scheme =
            esp_efuse_get_coding_scheme(EFUSE_BLK3);
        if (scheme != EFUSE_CODING_SCHEME_NONE) {
          ESP_LOGE(TAG,
                   "Refusing HMAC-key provisioning: BLK3 coding scheme is %d, not 256-bit NONE",
                   static_cast<int>(scheme));
          return;
        }

        if (esp_efuse_get_key_dis_read(EFUSE_BLK3)) {
          ESP_LOGE(TAG,
                   "Refusing HMAC-key provisioning: BLK3 is read-protected");
          return;
        }

        const bool already_write_protected =
            esp_efuse_get_key_dis_write(EFUSE_BLK3);

        uint8_t existing[KEY_BYTES] = {};
        esp_err_t err =
            esp_efuse_read_block(EFUSE_BLK3, existing, 0, KEY_BITS);
        if (err != ESP_OK) {
          ESP_LOGE(TAG, "Unable to read BLK3: %s", esp_err_to_name(err));
          wipe(existing, sizeof(existing));
          return;
        }

        uint8_t existing_or = 0;
        for (size_t i = 0; i < KEY_BYTES; i++) {
          existing_or |= existing[i];
        }
        wipe(existing, sizeof(existing));

        if (existing_or != 0) {
          if (already_write_protected) {
            ESP_LOGI(TAG,
                     "HMAC key already provisioned; BLK3 is write-protected and readable");
          } else {
            ESP_LOGE(TAG,
                     "BLK3 already contains data but is not write-protected; refusing to modify it");
          }
          return;
        }

        if (already_write_protected) {
          ESP_LOGE(TAG,
                   "BLK3 is empty but already write-protected; HMAC key cannot be provisioned");
          return;
        }

        uint8_t key[KEY_BYTES] = {};
        esp_fill_random(key, sizeof(key));

        uint8_t random_or = 0;
        for (size_t i = 0; i < KEY_BYTES; i++) {
          random_or |= key[i];
        }
        if (random_or == 0) {
          ESP_LOGE(TAG,
                   "Hardware RNG unexpectedly returned an all-zero key; refusing to burn BLK3");
          wipe(key, sizeof(key));
          return;
        }

        ESP_LOGI(TAG,
                 "BLK3 is empty; generated a 256-bit HMAC key from the hardware RNG");

        err = esp_efuse_write_block(EFUSE_BLK3, key, 0, KEY_BITS);
        if (err != ESP_OK) {
          ESP_LOGE(TAG, "Failed to burn HMAC key into BLK3: %s",
                   esp_err_to_name(err));
          wipe(key, sizeof(key));
          return;
        }

        uint8_t verify[KEY_BYTES] = {};
        err = esp_efuse_read_block(EFUSE_BLK3, verify, 0, KEY_BITS);
        if (err != ESP_OK) {
          ESP_LOGE(TAG,
                   "HMAC key was burned, but BLK3 could not be read back for verification: %s",
                   esp_err_to_name(err));
          wipe(key, sizeof(key));
          wipe(verify, sizeof(verify));
          return;
        }

        uint8_t difference = 0;
        for (size_t i = 0; i < KEY_BYTES; i++) {
          difference |= key[i] ^ verify[i];
        }
        wipe(key, sizeof(key));
        wipe(verify, sizeof(verify));

        if (difference != 0) {
          ESP_LOGE(TAG,
                   "BLK3 verification FAILED; refusing to write-protect the block");
          return;
        }

        ESP_LOGI(TAG, "BLK3 HMAC key burn verified successfully");

        err = esp_efuse_set_write_protect(EFUSE_BLK3);
        if (err != ESP_OK) {
          ESP_LOGE(TAG,
                   "HMAC key is present, but permanent BLK3 write protection failed: %s",
                   esp_err_to_name(err));
          return;
        }

        if (!esp_efuse_get_key_dis_write(EFUSE_BLK3)) {
          ESP_LOGE(TAG,
                   "HMAC key is present, but BLK3 write protection did not verify");
          return;
        }

        ESP_LOGI(TAG,
                 "BLK3 HMAC key provisioned, verified, and permanently write-protected");

  ap:
    ssid: "Garage-Keypad-Fallback"
    password: "${fallback_ap_password}"

captive_portal:

# Enter a minimal recovery environment after repeated failed boots. In safe
# mode ESPHome leaves networking, logging, and OTA available so a bad firmware
# update can normally be repaired wirelessly.
safe_mode:
  num_attempts: 5
  boot_is_good_after: 1min
  reboot_timeout: 10min

# ---------------------------------------------------------------------------
# Garage keypad - Wiegand input and PIN collection
# ---------------------------------------------------------------------------
#
# Connect the LOW-VOLTAGE / 3.3 V side of the level shifter as follows:
#   Green D0: HV3 -> LV3 -> ${garage_keypad_d0_pin}
#   White D1: HV2 -> LV2 -> ${garage_keypad_d1_pin}
#
# The pin substitutions default to GPIO22/GPIO19 but can be overridden in the
# local Device Builder wrapper if the physical wiring changes.
wiegand:
  - id: garage_keypad_wiegand
    d0: "${garage_keypad_d0_pin}"
    d1: "${garage_keypad_d1_pin}"

# Collect 4-8 numeric digits. '#' submits the PIN, '*' clears the current
# entry, and an incomplete entry is discarded after ten seconds.
#
# In production the completed PIN is not exposed as an ESPHome entity. It is
# passed directly to Home Assistant as transient action data for validation.
# When keypad_debug_logging is explicitly enabled, the plaintext value is also
# published to a diagnostic text sensor for bench testing.
key_collector:
  - id: garage_keypad_pin
    source_id: garage_keypad_wiegand
    min_length: 4
    max_length: 8
    allowed_keys: "0123456789"
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    timeout: 10s

    on_result:
      # DEBUG ONLY: when explicitly enabled, log the completed plaintext PIN.
      - lambda: |-
          if (strcmp("${keypad_debug_logging}", "true") == 0) {
            ESP_LOGW("keypad", "DEBUG MODE - PIN entered: [%s]", x.c_str());
          } else {
            ESP_LOGI("keypad", "PIN entered (%u digits)",
                     static_cast<unsigned>(x.size()));
          }

      # Send the completed PIN directly to Home Assistant over the encrypted
      # native API. Home Assistant owns authorization and garage-door actions.
      # The Home Assistant ESPHome integration must allow this device to
      # perform Home Assistant actions.
      - homeassistant.action:
          action: script.garage_keypad_validate_pin
          data:
            pin: !lambda |-
              return x.c_str();

    on_timeout:
      - logger.log:
          tag: keypad
          level: INFO
          format: "PIN entry timed out"

# The onboard blue LED on this 30-pin ESP32-WROOM-32 board is connected to
# GPIO2. GPIO2 is a boot strapping pin, but the board already uses it for the
# onboard LED and we do not attach external pull-up/down hardware to it. The
# warning is therefore intentionally suppressed while retaining normal GPIO2
# behavior after boot.
output:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: blue_led_output

light:
  - platform: binary
    id: blue_status_led
    output: blue_led_output
    internal: true
    restore_mode: ALWAYS_OFF

globals:
  # Current position within the LED blink pattern.
  - id: blue_status_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'

  # Number of native API clients whose reported name begins with
  # "Home Assistant ". Logger-only clients do not affect this value.
  - id: home_assistant_api_connections
    type: uint8_t
    restore_value: no
    initial_value: '0'

# Status LED behavior:
#   Regular blink:        Wi-Fi is disconnected / searching.
#   Double blink + pause: Wi-Fi is connected, but Home Assistant is not.
#   Solid:                Home Assistant is connected to the encrypted API.
#
# The 250 ms scheduler gives a 500 ms on/off Wi-Fi-search blink and a
# 250 ms ON, 250 ms OFF, 250 ms ON, 1 second OFF double-blink pattern.
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(home_assistant_api_connections) > 0;
          then:
            - light.turn_on: blue_status_led
            - lambda: |-
                id(blue_status_phase) = 0;
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  # Double blink followed by a one-second pause.
                  - if:
                      condition:
                        lambda: |-
                          return id(blue_status_phase) == 0 ||
                                 id(blue_status_phase) == 2;
                      then:
                        - light.turn_on: blue_status_led
                      else:
                        - light.turn_off: blue_status_led
                  - lambda: |-
                      id(blue_status_phase) =
                          (id(blue_status_phase) + 1) % 7;
                else:
                  # Regular 500 ms on / 500 ms off blink while looking for Wi-Fi.
                  - if:
                      condition:
                        lambda: |-
                          return id(blue_status_phase) < 2;
                      then:
                        - light.turn_on: blue_status_led
                      else:
                        - light.turn_off: blue_status_led
                  - lambda: |-
                      id(blue_status_phase) =
                          (id(blue_status_phase) + 1) % 4;

# Expose the same Home Assistant connection state used by the blue LED as a
# diagnostic entity on the Garage Keypad device. The connectivity device class
# makes Home Assistant render the states as Connected / Disconnected.
binary_sensor:
  - platform: template
    name: "Home Assistant Connected"
    id: home_assistant_connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(home_assistant_api_connections) > 0;

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    type: seconds

  # Internal ESP32 silicon temperature. This is a die-temperature diagnostic,
  # not an ambient-temperature measurement for the project enclosure.
  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  # DEBUG ONLY: ESPHome's native key_collector text sensor receives completed
  # keypad values directly from garage_keypad_pin. The filter suppresses all
  # plaintext publication unless keypad_debug_logging is explicitly true.
  - platform: key_collector
    name: "Debug Last Keypad Value"
    id: keypad_debug_last_value
    source_id: garage_keypad_pin
    icon: "mdi:dialpad"
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (strcmp("${keypad_debug_logging}", "true") == 0) {
            return x;
          }
          return {};

  # Last HMAC generated by the generate_pin_hmac API action. This is the
  # verifier value intended for the Home Assistant PIN map; it is not the
  # secret BLK3 HMAC key and does not contain the plaintext PIN.
  - platform: template
    name: "Generated PIN HMAC"
    id: generated_pin_hmac
    icon: "mdi:key-chain-variant"
    entity_category: diagnostic
    update_interval: never

  # Expose this file's explicit firmware version to Home Assistant. ESPHome's
  # project version is also included in the native API device_info response.
  - platform: template
    name: "Firmware Version"
    id: firmware_version_text
    icon: "mdi:information-box"
    entity_category: diagnostic
    update_interval: 600s
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "WiFi MAC Address"

button:
  - platform: restart
    name: "Restart"

  - platform: safe_mode
    name: "Restart in Safe Mode"
