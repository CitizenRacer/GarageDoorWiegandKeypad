# Copy this configuration into ESPHome Device Builder.
# The production firmware is loaded from the repository's main branch; secret
# values are resolved from Device Builder's local secrets.yaml.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  fallback_ap_password: !secret fallback_ap_password
  garage_keypad_api_encryption_key: !secret garage_keypad_api_encryption_key

  # Production setting for v20. Debug Mode is an independent physical-opening
  # safety gate; PIN values are never intentionally logged in either state.
  # Set this to "true" only for an intentional no-motion/maintenance test, then
  # redeploy and positively confirm the Home Assistant Debug Mode sensor is on.
  keypad_debug_mode: "false"

  # Optional Home Assistant / Lock Code Manager overrides. These are not
  # secrets; the remote package contains the production defaults.
  # lock_code_manager_entry_id: "your_lcm_config_entry_id"
  # garage_keypad_source_entity_id: "binary_sensor.your_keypad_debug_mode"
  # garage_door_entity_id: "cover.your_garage_door"

  # Optional Wiegand GPIO overrides. The remote firmware defaults to GPIO22
  # for D0 (Retekess T-AC04 Green via HV3/LV3) and GPIO19 for D1 (T-AC04 White
  # via HV2/LV2), so these are normally unnecessary.
  # garage_keypad_d0_pin: "GPIO22"
  # garage_keypad_d1_pin: "GPIO19"

# v20 removed the former HMAC generator and Generated PIN HMAC text sensor.
# Do not carry forward v19-only wrapper entries such as keypad_debug_logging or
# `!extend generated_pin_hmac`; those IDs/substitutions no longer exist.

packages:
  garage_keypad:
    url: https://github.com/CitizenRacer/GarageDoorWiegandKeypad
    ref: main
    files:
      - esphome/garage-keypad.yaml
    refresh: 60s
