# Copy this configuration into ESPHome Device Builder.
# The firmware is loaded from the public GitHub repository; credential values
# are resolved from Device Builder's local secrets.yaml.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  fallback_ap_password: !secret fallback_ap_password
  garage_keypad_api_encryption_key: !secret garage_keypad_api_encryption_key

  # PRODUCTION DEFAULT: keep debug logging off. Firmware never intentionally
  # logs plaintext keypad PINs. When this override is temporarily set to
  # "true", completed PIN HMAC verifiers are logged for troubleshooting and
  # the v18 Debug Mode diagnostic reports on. HMAC verifiers are authorization
  # material, and Debug Mode is an absolute lockout against opening the garage
  # through the keypad API.
  keypad_debug_logging: "false"

  # Optional Wiegand GPIO overrides. The remote firmware defaults to GPIO22
  # for D0 (Green via HV3/LV3) and GPIO19 for D1 (White via HV2/LV2), so these
  # are normally unnecessary.
  # garage_keypad_d0_pin: "GPIO22"
  # garage_keypad_d1_pin: "GPIO19"

packages:
  garage_keypad:
    url: https://github.com/CitizenRacer/GarageDoorWiegandKeypad
    ref: main
    files:
      - esphome/garage-keypad.yaml
    refresh: 60s
