# Home Assistant automation fragment for Garage Door Wiegand Keypad firmware v20.
#
# This automation is independent of credential validation. Lock Code Manager
# decides whether a PIN is valid; this automation manages only restoration of an
# alarm mode that the guarded keypad opening flow itself temporarily disarmed.
#
# input_select.garage_keypad_alarm_restore_mode is an ownership marker:
# `none` means no keypad-owned restore is pending; an armed mode means the
# keypad opening flow itself disarmed the alarm and must restore that exact mode.
#
# Behavior:
#   * on garage -> closed, restore the saved mode only if the alarm is still
#     disarmed;
#   * on any transition to a supported armed state while a marker is pending,
#     preserve that armed state and immediately clear the marker;
#   * if the garage closes with a marker pending but the alarm is already in a
#     supported armed state, preserve it and clear the stale marker.
#
# This intentionally does not trigger on alarm -> disarmed. The keypad opening
# script may disarm while the garage is still closed; that intermediate state
# must not cause restoration before the garage has opened and later closed.

- id: "1787327095781"
  alias: Garage Keypad - Restore Alarm After Garage Closes
  description: >-
    Restore the exact alarm mode only when the keypad opening flow previously
    disarmed the alarm. A garage-closed transition performs the restore if the
    alarm is still disarmed. Any transition back to a supported armed state is
    treated as an intentional re-arm: preserve that state and immediately clear
    the pending keypad restore marker. This avoids overriding a manual re-arm
    and avoids restoring merely because the keypad just disarmed the alarm while
    the garage was still closed.

  triggers:
    - trigger: state
      entity_id: cover.ratgdov25i_15cde7_door
      to: closed
      id: garage_closed

    - trigger: state
      entity_id: alarm_control_panel.5744_surety_5744
      to: armed_home
      id: alarm_rearmed

    - trigger: state
      entity_id: alarm_control_panel.5744_surety_5744
      to: armed_away
      id: alarm_rearmed

    - trigger: state
      entity_id: alarm_control_panel.5744_surety_5744
      to: armed_night
      id: alarm_rearmed

    - trigger: state
      entity_id: alarm_control_panel.5744_surety_5744
      to: armed_vacation
      id: alarm_rearmed

    - trigger: state
      entity_id: alarm_control_panel.5744_surety_5744
      to: armed_custom_bypass
      id: alarm_rearmed

  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.garage_keypad_alarm_restore_mode
          state: none

  actions:
    - choose:
        # A supported armed-state transition while the keypad restore marker is
        # pending is authoritative. Preserve it and relinquish keypad ownership
        # immediately, even if the garage is still open.
        - conditions:
            - condition: trigger
              id: alarm_rearmed
          sequence:
            - alias: Clear pending restore after any re-arm
              action: input_select.select_option
              target:
                entity_id: input_select.garage_keypad_alarm_restore_mode
              data:
                option: none

            - alias: Record preserved re-arm
              action: logbook.log
              data:
                name: Garage Keypad
                message: >-
                  Alarm re-armed while keypad restore was pending; preserved
                  current armed state and cleared restore marker
                entity_id: input_select.garage_keypad_alarm_restore_mode

        # Normal keypad-owned restoration: only the garage-closed transition
        # may restore, and only while the alarm is still disarmed.
        - conditions:
            - condition: trigger
              id: garage_closed
            - condition: state
              entity_id: alarm_control_panel.5744_surety_5744
              state: disarmed
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_select.garage_keypad_alarm_restore_mode
                      state: armed_home
                  sequence:
                    - action: alarm_control_panel.alarm_arm_home
                      target:
                        entity_id: alarm_control_panel.5744_surety_5744

                - conditions:
                    - condition: state
                      entity_id: input_select.garage_keypad_alarm_restore_mode
                      state: armed_away
                  sequence:
                    - action: alarm_control_panel.alarm_arm_away
                      target:
                        entity_id: alarm_control_panel.5744_surety_5744

                - conditions:
                    - condition: state
                      entity_id: input_select.garage_keypad_alarm_restore_mode
                      state: armed_night
                  sequence:
                    - action: alarm_control_panel.alarm_arm_night
                      target:
                        entity_id: alarm_control_panel.5744_surety_5744

                - conditions:
                    - condition: state
                      entity_id: input_select.garage_keypad_alarm_restore_mode
                      state: armed_vacation
                  sequence:
                    - action: alarm_control_panel.alarm_arm_vacation
                      target:
                        entity_id: alarm_control_panel.5744_surety_5744

                - conditions:
                    - condition: state
                      entity_id: input_select.garage_keypad_alarm_restore_mode
                      state: armed_custom_bypass
                  sequence:
                    - action: alarm_control_panel.alarm_arm_custom_bypass
                      target:
                        entity_id: alarm_control_panel.5744_surety_5744

        # Defensive cleanup for a close event that finds the alarm already
        # armed. Do not change the armed state; just remove stale ownership.
        - conditions:
            - condition: trigger
              id: garage_closed
            - condition: state
              entity_id: alarm_control_panel.5744_surety_5744
              state:
                - armed_home
                - armed_away
                - armed_night
                - armed_vacation
                - armed_custom_bypass
          sequence:
            - alias: Clear stale pending restore without changing armed state
              action: input_select.select_option
              target:
                entity_id: input_select.garage_keypad_alarm_restore_mode
              data:
                option: none

            - alias: Record preserved armed state at close
              action: logbook.log
              data:
                name: Garage Keypad
                message: >-
                  Garage closed with alarm already armed; preserved current
                  armed state and cleared restore marker
                entity_id: input_select.garage_keypad_alarm_restore_mode

  mode: queued
  max: 10
