# Example /config/garage_keypad_users.yaml for Home Assistant.
#
# Copy this file to /config/garage_keypad_users.yaml and replace the example
# verifier values with HMAC-SHA256 values generated by the garage keypad ESP32.
#
# Format:
#   "<64-character lowercase HMAC verifier>": "Friendly User Name"
#
# Do NOT put plaintext PINs in this file. Do NOT commit the live file.

"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef": "Example User"
"abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789": "Example Guest"
