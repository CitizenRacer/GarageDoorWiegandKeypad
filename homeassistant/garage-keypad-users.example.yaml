# Example /config/garage_keypad_users.yaml for Home Assistant.
#
# PIN and RFID credentials share this one authorization file while remaining in
# separate namespaces. Existing PIN HMAC mappings stay at the top level so the
# PIN validation path does not need to migrate.
#
# PIN format:
#   "<64-character lowercase PIN HMAC verifier>": "Friendly User Name"
#
# RFID format:
#   rfid:
#     "<64-character lowercase RFID HMAC verifier>": "Friendly User Name"
#
# Do NOT put plaintext PINs or raw RFID credential values in this file. Do NOT
# commit the live file.

"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef": "Example User"
"abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789": "Example Guest"

rfid:
  "1111111111111111111111111111111111111111111111111111111111111111": "Example RFID Tag"
