# Example Home Assistant-side secrets used by the garage-keypad validation
# scripts.
#
# Copy the relevant entries into Home Assistant's local /config/secrets.yaml.
# The HMAC verifier-to-user maps do not belong in secrets.yaml; they live in
# /config/garage_keypad_users.yaml. See garage-keypad-users.example.yaml.
#
# Garage opening is handled by the fail-closed
# script.garage_keypad_open_garage path and is intentionally not wired into the
# PIN/RFID validators until explicitly enabled. No garage-opening automation
# entity is supplied through secrets.yaml.

garage_keypad_notify_service: "notify.mobile_app_your_phone"
