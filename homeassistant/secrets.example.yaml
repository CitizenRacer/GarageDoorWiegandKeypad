# Example Home Assistant-side values for the garage keypad.
# Copy the relevant entries into Home Assistant's local /config/secrets.yaml.
# Never commit real PINs.
#
# Keep PIN keys quoted so leading zeroes are preserved.
garage_keypad_pins:
  "1234": "Example User"
  "5678": "Example Guest"

# This value is local configuration rather than a sensitive credential, but it
# is kept alongside the PIN map so the repository script remains portable.
garage_keypad_garage_entity: "cover.your_garage_door"
