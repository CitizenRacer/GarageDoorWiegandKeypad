# Example Home Assistant-side values for the garage keypad.
# Copy the relevant entries into Home Assistant's local /config/secrets.yaml.
#
# Store only HMAC-SHA256 verifiers here. Do not store plaintext PINs.
# Each verifier is 64 lowercase hexadecimal characters generated by the ESP32
# using its device-local BLK3 HMAC key.
garage_keypad_hmacs:
  "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef": "Example User"
  "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789": "Example Guest"

# This value is local configuration rather than a sensitive credential, but it
# is kept alongside the verifier map so the repository script remains portable.
garage_keypad_garage_entity: "cover.your_garage_door"
