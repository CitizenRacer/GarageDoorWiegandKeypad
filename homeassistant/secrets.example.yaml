# Example Home Assistant-side secret used by the garage-keypad validation
# scripts.
#
# Copy the relevant entry into Home Assistant's local /config/secrets.yaml.
# The HMAC verifier-to-user mappings do not belong in secrets.yaml; they live in
# /config/garage_keypad_users.yaml. See garage-keypad-users.example.yaml.
#
# Garage operation is handled by script.garage_keypad_open_garage. There is no
# additional opening-enable toggle. The opening branch fails closed unless the
# garage cover is exactly closed, the alarm restore marker is exactly none,
# Debug Mode is exactly off, and the alarm is positively disarmed before the
# open command is issued.

garage_keypad_notify_service: "notify.mobile_app_your_phone"
