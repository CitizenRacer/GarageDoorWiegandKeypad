# Home Assistant script fragment for Garage Door Wiegand Keypad firmware v19.
#
# PIN and RFID authorization both use /config/garage_keypad_users.yaml. PIN
# HMAC -> friendly-name entries remain at the top level. RFID HMAC ->
# friendly-name entries live under the nested `rfid:` key.
#
# Both valid credential paths call script.garage_keypad_open_garage and pass the
# resolved friendly name as person_name.
#
# Door-action contract:
#   * cover exactly open -> close immediately; do not alter the alarm;
#   * otherwise opening requires cover exactly closed;
#   * opening requires restore marker exactly none;
#   * opening requires Debug Mode exactly off;
#   * if the alarm is already disarmed, open without creating a restore marker;
#   * if the alarm is in a supported armed mode, capture the exact mode, disarm,
#     positively confirm disarmed, store the mode as a keypad-owned restore
#     marker, then open;
#   * any unsupported/unknown/unavailable state fails closed;
#   * after a successful opening, announce "<friendly user name> opened the
#     garage door" on the kitchen Alexa.
#
# The companion automation in garage-keypad-automation.yaml owns restoration.
# It restores only when the keypad flow created the marker and clears that
# marker immediately if the alarm transitions back to a supported armed state.
#
# Required local files/settings:
#   /config/garage_keypad_users.yaml
#     Top-level PIN HMAC -> friendly-name mappings plus nested `rfid:` mappings.
#     Do not store plaintext PINs or raw RFID credential values there.
#
#   /config/secrets.yaml
#     garage_keypad_notify_service: "notify.mobile_app_your_phone"
#
# Required helpers:
#   input_select.garage_keypad_alarm_restore_mode
#     Options: none, armed_home, armed_away, armed_night, armed_vacation,
#     armed_custom_bypass. Initial/default option: none.
#
#   input_text.garage_keypad_activity
#     Latest valid/invalid keypad activity without verifier material.
#
# There is intentionally no additional opening-enable toggle.

garage_keypad_validate_hmac:
  alias: Garage Keypad - Validate HMAC
  description: >-
    Validate a 64-character lowercase HMAC-SHA256 verifier submitted by the
    garage ESPHome keypad against /config/garage_keypad_users.yaml. Plaintext
    PINs are not stored or accepted. On a valid credential, resolve the
    friendly user, notify/log, and invoke the common guarded keypad door-action
    API with that friendly name.
  mode: queued
  max: 10
  trace:
    stored_traces: 0

  fields:
    hmac:
      name: PIN HMAC
      description: 64-character lowercase HMAC-SHA256 verifier generated by the ESP32.
      required: true
      selector:
        text:

  sequence:
    - alias: Load garage keypad user map
      action: file.read_file
      data:
        file_name: /config/garage_keypad_users.yaml
        file_encoding: YAML
      response_variable: keypad_users_file

    - alias: Resolve friendly user name
      variables:
        submitted_hmac: "{{ hmac | string | lower }}"
        matched_user: >-
          {{ keypad_users_file.data.get(submitted_hmac, '')
             if keypad_users_file.data is mapping else '' }}

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ submitted_hmac | length == 64 and matched_user | length > 0 }}
          sequence:
            - alias: Notify valid credential
              action: !secret garage_keypad_notify_service
              data:
                message: >-
                  Valid Code for User "{{ matched_user }}"

            - alias: Record valid PIN activity
              action: input_text.set_value
              target:
                entity_id: input_text.garage_keypad_activity
              data:
                value: >-
                  Valid code for user "{{ matched_user }}" — {{ now().isoformat() }}

            - alias: Request common guarded garage door action
              action: script.garage_keypad_open_garage
              data:
                person_name: "{{ matched_user }}"
      default:
        - alias: Notify invalid credential
          action: !secret garage_keypad_notify_service
          data:
            title: Garage Keypad
            message: Invalid Garage Keypad Code

        - alias: Record invalid PIN activity
          action: input_text.set_value
          target:
            entity_id: input_text.garage_keypad_activity
          data:
            value: >-
              Invalid garage keypad code — {{ now().isoformat() }}

garage_keypad_validate_rfid_hmac:
  alias: Garage Keypad - Validate RFID HMAC
  description: >-
    Validate a 64-character lowercase RFID HMAC-SHA256 verifier submitted by
    the ESPHome garage keypad, resolve the friendly user from the nested rfid
    map, notify/log the result, and invoke the same common guarded keypad
    door-action API on success.
  mode: queued
  max: 10
  trace:
    stored_traces: 0

  fields:
    hmac:
      name: RFID HMAC
      description: 64-character lowercase RFID HMAC-SHA256 verifier generated by the ESP32.
      required: true
      selector:
        text:

  sequence:
    - alias: Load garage keypad user map
      action: file.read_file
      data:
        file_name: /config/garage_keypad_users.yaml
        file_encoding: YAML
      response_variable: keypad_users_file

    - alias: Resolve RFID friendly user name
      variables:
        submitted_hmac: "{{ hmac | string | lower }}"
        rfid_users: >-
          {{ keypad_users_file.data.get('rfid', {})
             if keypad_users_file.data is mapping else {} }}
        matched_user: >-
          {{ rfid_users.get(submitted_hmac, '')
             if rfid_users is mapping else '' }}

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ submitted_hmac | length == 64 and matched_user | length > 0 }}
          sequence:
            - alias: Log valid RFID credential
              action: logbook.log
              data:
                name: Garage Keypad RFID
                message: >-
                  Valid RFID for user "{{ matched_user }}"
                entity_id: script.garage_keypad_validate_rfid_hmac

            - alias: Notify valid RFID credential
              action: !secret garage_keypad_notify_service
              data:
                title: Garage Keypad RFID
                message: >-
                  Valid RFID for User "{{ matched_user }}"

            - alias: Record valid RFID activity
              action: input_text.set_value
              target:
                entity_id: input_text.garage_keypad_activity
              data:
                value: >-
                  Valid RFID for user "{{ matched_user }}" - {{ now().isoformat() }}

            - alias: Request common guarded garage door action
              action: script.garage_keypad_open_garage
              data:
                person_name: "{{ matched_user }}"
      default:
        - alias: Log invalid RFID credential
          action: logbook.log
          data:
            name: Garage Keypad RFID
            message: Invalid RFID attempt
            entity_id: script.garage_keypad_validate_rfid_hmac

        - alias: Notify invalid RFID credential
          action: !secret garage_keypad_notify_service
          data:
            title: Garage Keypad RFID
            message: Invalid Garage Keypad RFID

        - alias: Record invalid RFID activity
          action: input_text.set_value
          target:
            entity_id: input_text.garage_keypad_activity
          data:
            value: >-
              Invalid garage keypad RFID - {{ now().isoformat() }}

garage_keypad_open_garage:
  alias: Garage Keypad - Open Garage
  description: >-
    Common garage keypad door-action API. If the garage door is exactly open, a
    valid keypad credential closes it immediately without changing the alarm.
    Otherwise the door must positively report closed, the alarm restore marker
    must positively report none, and ESP32 Debug Mode must positively report
    off before an opening transaction may begin. If the house alarm is armed,
    capture the exact supported armed mode, disarm it, positively confirm
    disarmed, record keypad ownership of that disarm, and only then open.
    Unknown, unavailable, transitional, or unsupported states fail closed. If
    the alarm was already disarmed, no restore marker is created.
  icon: mdi:garage-lock
  mode: single
  trace:
    stored_traces: 0

  fields:
    person_name:
      name: Person Name
      description: Friendly name associated with the valid keypad credential.
      required: false
      selector:
        text:

  sequence:
    - alias: Close if garage is already open; otherwise use guarded opening flow
      choose:
        - conditions:
            - condition: state
              entity_id: cover.ratgdov25i_15cde7_door
              state: open
          sequence:
            - alias: Close garage door
              action: cover.close_cover
              target:
                entity_id: cover.ratgdov25i_15cde7_door
      default:
        - alias: Require garage door positively closed before opening
          condition: state
          entity_id: cover.ratgdov25i_15cde7_door
          state: closed

        - alias: Require no pending keypad alarm restore
          condition: state
          entity_id: input_select.garage_keypad_alarm_restore_mode
          state: none

        - alias: Require ESP32 debug mode off
          condition: state
          entity_id: binary_sensor.garage_garage_keypad_debug_mode
          state: "off"

        - alias: Capture alarm state before keypad access
          variables:
            alarm_before: "{{ states('alarm_control_panel.5744_surety_5744') }}"

        - alias: Disarm alarm only if keypad found it armed
          choose:
            - conditions:
                - condition: state
                  entity_id: alarm_control_panel.5744_surety_5744
                  state:
                    - armed_home
                    - armed_away
                    - armed_night
                    - armed_vacation
                    - armed_custom_bypass
              sequence:
                - alias: Disarm house alarm
                  action: alarm_control_panel.alarm_disarm
                  target:
                    entity_id: alarm_control_panel.5744_surety_5744

                - alias: Wait for disarm if needed
                  if:
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: alarm_control_panel.5744_surety_5744
                          state: disarmed
                  then:
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: alarm_control_panel.5744_surety_5744
                          to: disarmed
                      timeout: 00:00:15
                      continue_on_timeout: false

                - alias: Require confirmed disarm
                  condition: state
                  entity_id: alarm_control_panel.5744_surety_5744
                  state: disarmed

                - alias: Record keypad-owned restore mode
                  action: input_select.select_option
                  target:
                    entity_id: input_select.garage_keypad_alarm_restore_mode
                  data:
                    option: "{{ alarm_before }}"

        - alias: Require confirmed disarmed alarm before opening
          condition: state
          entity_id: alarm_control_panel.5744_surety_5744
          state: disarmed

        - alias: Open garage door
          action: cover.open_cover
          target:
            entity_id: cover.ratgdov25i_15cde7_door

        - alias: Announce opener in kitchen
          action: notify.alexa_media_kitchen_echo_show
          data:
            message: >-
              {{ person_name | default('Someone', true) }} opened the garage door
            data:
              type: announce

# Administrative helper used when adding or rotating a keypad code. The PIN is
# sent to the ESP32's encrypted ESPHome API action; the ESP32 returns only the
# HMAC verifier. This helper disables stored traces because its input is a
# plaintext PIN. It does not validate a credential or operate the garage door.
garage_keypad_generate_pin_hmac:
  alias: Garage Keypad - Generate PIN HMAC
  description: >-
    Send a garage keypad PIN to the ESP32 HMAC generator and return the
    resulting verifier. This does not validate a PIN or operate the garage door.
  icon: mdi:key-chain-variant
  mode: queued
  max: 10
  trace:
    stored_traces: 0

  fields:
    pin:
      name: Garage Code
      description: >-
        Garage keypad code to HMAC. Treated as text so leading zeroes are
        preserved exactly.
      required: true
      selector:
        text:
          multiline: false

  sequence:
    - alias: Ask ESP32 to generate HMAC
      action: esphome.garage_keypad_generate_pin_hmac
      data:
        pin: "{{ pin | string }}"
      response_variable: hmac_result

    - alias: Capture generated HMAC
      variables:
        result:
          hmac: "{{ hmac_result.hmac }}"

    - alias: Return generated HMAC
      stop: HMAC generated
      response_variable: result
