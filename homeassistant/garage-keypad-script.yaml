# Home Assistant script fragment for Garage Door Wiegand Keypad firmware v20.
#
# Lock Code Manager performs production PIN validation directly through
# lock_code_manager.use_credential. Firmware calls this common guarded door
# action only after LCM returns a valid credential and friendly user name.
#
# RFID authorization is disabled in v20. There are no custom PIN/RFID validator
# scripts, HMAC helpers, or credential-map file dependencies in this fragment.
#
# IMPORTANT: this checked-in script is the documented fail-closed baseline. The
# production live instance also contains RATGDO motor-start verification/retry
# behavior. Preserve those production enhancements when synchronizing this file;
# do not replace the more capable live script with this simpler baseline.
#
# Required helper:
#   input_select.garage_keypad_alarm_restore_mode
#     Options: none, armed_home, armed_away, armed_night, armed_vacation,
#     armed_custom_bypass. Initial/default option: none.

garage_keypad_open_garage:
  alias: Garage Keypad - Open Garage
  description: >-
    Common garage keypad door-action API. Called only after Lock Code Manager
    accepts a PIN. If the garage door is exactly open, a valid credential closes
    it immediately without changing the alarm. Otherwise the door must positively
    report closed, the alarm restore marker must positively report none, and ESP32
    Debug Mode must positively report off before an opening transaction may begin.
    If the house alarm is armed, capture the exact supported armed mode, disarm it,
    positively confirm disarmed, record keypad ownership of that disarm, and only
    then open. Unknown, unavailable, transitional, or unsupported states fail
    closed. If the alarm was already disarmed, no restore marker is created.
  icon: mdi:garage-lock
  mode: single
  trace:
    stored_traces: 0

  fields:
    person_name:
      name: Person Name
      description: Friendly name returned by Lock Code Manager for the accepted PIN.
      required: false
      selector:
        text:

  sequence:
    - alias: Close if garage is already open; otherwise use guarded opening flow
      choose:
        - conditions:
            - condition: state
              entity_id: cover.ratgdov25i_15cde7_door
              state: open
          sequence:
            - alias: Close garage door
              action: cover.close_cover
              target:
                entity_id: cover.ratgdov25i_15cde7_door
      default:
        - alias: Require garage door positively closed before opening
          condition: state
          entity_id: cover.ratgdov25i_15cde7_door
          state: closed

        - alias: Require no pending keypad alarm restore
          condition: state
          entity_id: input_select.garage_keypad_alarm_restore_mode
          state: none

        - alias: Require ESP32 debug mode off
          condition: state
          entity_id: binary_sensor.garage_garage_keypad_debug_mode
          state: "off"

        - alias: Capture alarm state before keypad access
          variables:
            alarm_before: "{{ states('alarm_control_panel.5744_surety_5744') }}"

        - alias: Disarm alarm only if keypad found it armed
          choose:
            - conditions:
                - condition: state
                  entity_id: alarm_control_panel.5744_surety_5744
                  state:
                    - armed_home
                    - armed_away
                    - armed_night
                    - armed_vacation
                    - armed_custom_bypass
              sequence:
                - alias: Disarm house alarm
                  action: alarm_control_panel.alarm_disarm
                  target:
                    entity_id: alarm_control_panel.5744_surety_5744

                - alias: Wait for disarm if needed
                  if:
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: alarm_control_panel.5744_surety_5744
                          state: disarmed
                  then:
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: alarm_control_panel.5744_surety_5744
                          to: disarmed
                      timeout: 00:00:15
                      continue_on_timeout: false

                - alias: Require confirmed disarm
                  condition: state
                  entity_id: alarm_control_panel.5744_surety_5744
                  state: disarmed

                - alias: Record keypad-owned restore mode
                  action: input_select.select_option
                  target:
                    entity_id: input_select.garage_keypad_alarm_restore_mode
                  data:
                    option: "{{ alarm_before }}"

        - alias: Require confirmed disarmed alarm before opening
          condition: state
          entity_id: alarm_control_panel.5744_surety_5744
          state: disarmed

        - alias: Open garage door
          action: cover.open_cover
          target:
            entity_id: cover.ratgdov25i_15cde7_door

        - alias: Announce opener in kitchen
          action: notify.alexa_media_kitchen_echo_show
          data:
            message: >-
              {{ person_name | default('Someone', true) }} opened the garage door
            data:
              type: announce
