# Home Assistant script fragment for Garage Door Wiegand Keypad.
#
# PIN and RFID authorization both use /config/garage_keypad_users.yaml. Existing
# PIN HMAC -> user entries remain at the top level. RFID HMAC -> user entries
# live under the nested `rfid:` key so the two credential classes are separate.
#
# SAFETY: Garage opening is intentionally disabled by default. Valid PIN/RFID
# validation does not call the opening API until that integration is explicitly
# enabled. The opening script itself is fail-closed and requires ALL of:
#   1. input_boolean.garage_keypad_opening_enabled == on
#   2. binary_sensor.garage_garage_keypad_debug_mode == off
#   3. alarm_control_panel.5744_surety_5744 == disarmed
# Missing/unknown/unavailable states fail these native state conditions and stop
# the script before cover.open_cover can run.
#
# Required local files/settings:
#   /config/garage_keypad_users.yaml
#     Top-level 64-character PIN HMAC -> friendly user mappings, plus a nested
#     `rfid:` mapping of 64-character RFID HMAC -> friendly user.
#     See garage-keypad-users.example.yaml. Do not store plaintext PINs or raw
#     RFID credential values there.
#
#   /config/secrets.yaml
#     garage_keypad_notify_service: "notify.mobile_app_your_phone"
#
# Required Home Assistant helper (created in the UI for the live installation):
#   input_boolean.garage_keypad_opening_enabled
#   Initial/default state: off
#
# The ESP32 computes HMAC-SHA256 locally using its device-specific BLK3 key.
# Normal PIN and RFID validation sends only the verifier to Home Assistant.
# RFID decoded/raw values may still appear in ESPHome logs while commissioning.

garage_keypad_validate_hmac:
  alias: Garage Keypad - Validate HMAC
  description: >-
    Validate a PIN HMAC-SHA256 verifier submitted by the ESPHome garage keypad
    against /config/garage_keypad_users.yaml and send a phone notification.
    Garage-door control is intentionally disabled in this validator.
  mode: queued
  max: 10

  # The verifier is authorization material. Do not retain script traces that
  # could capture it.
  trace:
    stored_traces: 0

  fields:
    hmac:
      name: PIN HMAC
      description: 64-character HMAC-SHA256 verifier generated by the ESP32.
      required: true
      selector:
        text:

  sequence:
    - alias: Load garage keypad user map
      action: file.read_file
      data:
        file_name: /config/garage_keypad_users.yaml
        file_encoding: YAML
      response_variable: keypad_users_file

    - alias: Resolve friendly user name
      variables:
        submitted_hmac: "{{ hmac | string | lower }}"
        matched_user: >-
          {{ keypad_users_file.data.get(submitted_hmac, '')
             if keypad_users_file.data is mapping else '' }}

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ submitted_hmac | length == 64 and matched_user | length > 0 }}
          sequence:
            - alias: Notify valid credential
              action: !secret garage_keypad_notify_service
              data:
                message: >-
                  Valid Code for User "{{ matched_user }}"
      default:
        - alias: Notify invalid credential
          action: !secret garage_keypad_notify_service
          data:
            title: Garage Keypad
            message: Invalid Garage Keypad Code

# RFID validation uses the same authorization file but a separate nested map.
# Garage opening remains intentionally disconnected from this validator until
# explicitly enabled later.
garage_keypad_validate_rfid_hmac:
  alias: Garage Keypad - Validate RFID HMAC
  description: >-
    Validate an RFID HMAC-SHA256 verifier submitted by the ESPHome garage
    keypad, resolve the friendly user from the nested rfid map, and notify/log
    the result. Garage-door control is intentionally disabled in this validator.
  mode: queued
  max: 10

  trace:
    stored_traces: 0

  fields:
    hmac:
      name: RFID HMAC
      description: 64-character HMAC-SHA256 verifier generated by the ESP32.
      required: true
      selector:
        text:

  sequence:
    - alias: Load garage keypad user map
      action: file.read_file
      data:
        file_name: /config/garage_keypad_users.yaml
        file_encoding: YAML
      response_variable: keypad_users_file

    - alias: Resolve RFID friendly user name
      variables:
        submitted_hmac: "{{ hmac | string | lower }}"
        rfid_users: >-
          {{ keypad_users_file.data.get('rfid', {})
             if keypad_users_file.data is mapping else {} }}
        matched_user: >-
          {{ rfid_users.get(submitted_hmac, '')
             if rfid_users is mapping else '' }}

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ submitted_hmac | length == 64 and matched_user | length > 0 }}
          sequence:
            - alias: Log valid RFID credential
              action: logbook.log
              data:
                name: Garage Keypad
                message: >-
                  Valid RFID credential for user "{{ matched_user }}"

            - alias: Notify valid RFID credential
              action: !secret garage_keypad_notify_service
              data:
                title: Garage Keypad
                message: >-
                  Valid RFID for User "{{ matched_user }}"
      default:
        - alias: Log invalid RFID credential
          action: logbook.log
          data:
            name: Garage Keypad
            message: Invalid RFID credential

        - alias: Notify invalid RFID credential
          action: !secret garage_keypad_notify_service
          data:
            title: Garage Keypad
            message: Invalid Garage Keypad RFID Credential

# Garage-opening API. This script is intentionally NOT called by either
# validator above. It may only reach cover.open_cover when every fail-closed
# state condition below is positively satisfied.
garage_keypad_open_garage:
  alias: Garage Keypad - Open Garage
  description: >-
    Fail-closed garage keypad opening API. Requires explicit enablement, ESP32
    debug mode off, and the house alarm disarmed. Unknown/unavailable states
    block opening.
  icon: mdi:garage-lock
  mode: single
  trace:
    stored_traces: 0

  sequence:
    - alias: Require explicit garage keypad opening enable
      condition: state
      entity_id: input_boolean.garage_keypad_opening_enabled
      state: "on"

    - alias: Require ESP32 debug mode off
      condition: state
      entity_id: binary_sensor.garage_garage_keypad_debug_mode
      state: "off"

    - alias: Require house alarm disarmed
      condition: state
      entity_id: alarm_control_panel.5744_surety_5744
      state: disarmed

    - alias: Open garage door
      action: cover.open_cover
      target:
        entity_id: cover.ratgdov25i_15cde7_door

# Administrative helper used when adding or rotating a keypad code. The PIN is
# sent to the ESP32's encrypted ESPHome API action; the ESP32 returns only the
# HMAC verifier. This helper also disables stored traces because its input is a
# plaintext PIN.
garage_keypad_generate_pin_hmac:
  alias: Garage Keypad - Generate PIN HMAC
  description: >-
    Send a garage keypad PIN to the ESP32 HMAC generator and return the
    resulting verifier. This does not validate a PIN or operate the garage door.
  icon: mdi:key-chain-variant
  mode: queued
  max: 10

  trace:
    stored_traces: 0

  fields:
    pin:
      name: Garage Code
      description: >-
        Garage keypad code to HMAC. Treated as text so leading zeroes are
        preserved.
      required: true
      selector:
        text:
          multiline: false

  sequence:
    - alias: Ask ESP32 to generate HMAC
      action: esphome.garage_keypad_generate_pin_hmac
      data:
        pin: "{{ pin | string }}"
      response_variable: hmac_result

    - alias: Capture generated HMAC
      variables:
        result:
          hmac: "{{ hmac_result.hmac }}"

    - alias: Return generated HMAC
      stop: HMAC generated
      response_variable: result
