# Home Assistant script fragment for Garage Door Wiegand Keypad.
#
# This file is intended to be loaded as file-based Home Assistant YAML (or
# merged into an existing file-based scripts configuration). It deliberately
# uses !secret and therefore should not be pasted into the Home Assistant UI
# script editor.
#
# Required entries in the Home Assistant configuration-directory secrets.yaml:
#
# garage_keypad_hmacs:
#   "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef": "Example User"
#   "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789": "Example Guest"
# garage_keypad_garage_entity: "cover.your_garage_door"
#
# The keys are 64-character lowercase HMAC-SHA256 verifiers generated by the
# ESP32. Plaintext PINs do not belong in this file or in secrets.yaml.

garage_keypad_validate_hmac:
  alias: Garage Keypad - Validate HMAC
  description: >-
    Validate an HMAC-SHA256 verifier submitted by the ESPHome garage keypad and
    open the garage door when it matches an authorized entry in
    garage_keypad_hmacs.
  mode: queued
  max: 10

  # The verifier is security-sensitive because it is the stored authorization
  # value. Do not retain it in Home Assistant script traces.
  trace:
    stored_traces: 0

  fields:
    hmac:
      name: PIN HMAC
      description: 64-character HMAC-SHA256 verifier submitted by the ESP32.
      required: true
      selector:
        text:

  variables:
    # The authorization map is HMAC verifier -> friendly name. The plaintext
    # PIN and the device HMAC key are intentionally absent from Home Assistant.
    keypad_hmacs: !secret garage_keypad_hmacs
    submitted_hmac: "{{ hmac | string | lower }}"

  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ submitted_hmac | length == 64 and submitted_hmac in keypad_hmacs }}
          sequence:
            - action: cover.open_cover
              target:
                entity_id: !secret garage_keypad_garage_entity

            # Record only the friendly credential name. Never put the HMAC or
            # plaintext PIN in logbook data, entity state, or an event payload.
            - action: logbook.log
              data:
                name: Garage Keypad
                message: >-
                  Access granted: {{ keypad_hmacs.get(submitted_hmac, "Unknown") }}

      default:
        - action: logbook.log
          data:
            name: Garage Keypad
            message: Access denied: invalid credential
