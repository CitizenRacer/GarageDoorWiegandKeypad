name: v22 validation

on:
  push:
    branches:
      - v22-validation

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome 2026.8.2
        run: python -m pip install --upgrade "esphome==2026.8.2"

      - name: Create validation wrapper
        run: |
          cat > validation.yaml <<'EOF'
          substitutions:
            wifi_ssid: "validation-network"
            wifi_password: "validation-password"
            ota_password: "validation-ota-password"
            fallback_ap_password: "validation-fallback-password"
            garage_keypad_api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
            keypad_debug_mode: "false"

          packages:
            garage_keypad: !include esphome/garage-keypad.yaml
          EOF

      - name: Validate ESPHome YAML
        run: esphome config validation.yaml

      - name: Compile firmware
        run: esphome compile validation.yaml
